version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: school-erp-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: school_erp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: school-erp-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata:
